services:
  - type: web
    name: inventra-erp-app
    runtime: node
    plan: free
    buildCommand: npm run build:all
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: inventra-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://inventra-erp.onrender.com
      - key: BACKEND_URL
        value: https://inventra-erp.onrender.com

databases:
  - name: inventra-db
    plan: free

